uerySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));document.querySelector('#toggle').textContent=mode==='mockup'?'Ver wireframe':'Ver mockup';document.querySelector('#heading').textContent=names[page]}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;show()});document.querySelector('#toggle').onclick=()=>{mode=mode==='mockup'?'wireframe':'mockup';show()};show();</script></body></html>
