<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duerme Bien · Prototipo</title>
<style>
:root{font-family:Arial,sans-serif;color:#19374b;background:#f1f4f5;--accent:#176579}*{box-sizing:border-box}body{margin:0}header{padding:22px 30px;background:#15394d;color:white;display:flex;gap:20px;align-items:center}header h1{font-size:23px;margin:0}header p{margin:5px 0 0;font-size:13px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #a1b7bf;background:white;border-radius:5px;padding:10px 15px;color:#19374b}header button{margin-left:auto}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 96px)}nav{background:white;border-right:1px solid #d7e1e5;padding:20px 12px;display:flex;flex-direction:column;gap:5px}nav button{text-align:left;border:0;padding:13px}nav button[aria-current=page]{background:#e3f0f3;color:#0c576b;font-weight:bold}main{padding:34px;max-width:1200px;width:100%}h2{font-size:29px;margin:0 0 12px}.notice{padding:14px 18px;border-left:4px solid #bb8432;background:#fff9e8;color:#75531f;line-height:1.5;margin-bottom:24px;font-size:14px}.panel{background:white;padding:24px;border:1px solid #d4e0e4;border-radius:7px;margin:16px 0}p{line-height:1.5}form{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:18px}label{display:block;font-size:14px;font-weight:bold}input,select{display:block;width:100%;padding:12px;margin-top:8px;border:1px solid #a7bcc6;border-radius:4px;background:white}.full{grid-column:1/-1}button.primary{background:var(--accent);color:white;border:0}table{border-collapse:collapse;width:100%;margin-top:18px;font-size:15px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #dbe4e8}th{font-size:13px;background:#f2f6f7}.stats{display:flex;gap:40px;border-bottom:1px solid #cad8df;margin-bottom:24px;padding-bottom:20px}.stats strong{display:block;font-size:32px;margin-top:7px}.muted{color:#526d7b;font-size:14px}.result{padding:15px;background:#e5f4ef;margin-top:18px;line-height:1.6}.error{background:#fcebed;color:#983333}.wire{filter:grayscale(1)}.wire .panel,.wire button,.wire input,.wire select{border-radius:0}.wire header{background:#333}.wire .notice{background:#eee;color:#222}.wire *{box-shadow:none!important}.hidden{display:none}a{color:#176579}@media(max-width:780px){.layout{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap}main{padding:20px}form{grid-template-columns:1fr}.stats{gap:18px}header{padding:18px}table{font-size:12px}}
</style></head><body>
<header><div><h1>Duerme Bien</h1><p>Sistema de pasajeros de hotel · Maqueta</p></div><button id="wire" aria-pressed="false">Ver wireframe</button></header>
<div class="layout"><nav aria-label="Pantallas del prototipo" id="nav"></nav><main><div class="notice">Prototipo académico. Datos ficticios. Las tarifas y los permisos detallados requieren validación. Las acciones simulan la navegación y no guardan datos reales.</div><div id="view"></div></main></div>
<script>
const names=['Acceso','Disponibilidad','Habitaciones','Huéspedes','Reservas','Check-in','Check-out','Informes','Usuarios'];
const view=document.querySelector('#view'),nav=document.querySelector('#nav');
const input=(label,type='text',value='',extra='')=>`<label>${label}<input type="${type}" value="${value}" ${extra} required></label>`;
const select=(label,items)=>`<label>${label}<select>${items.map(v=>`<option>${v}</option>`).join('')}</select></label>`;
const form=(content,button)=>`<section class="panel"><form>${content}<div class="full"><button class="primary" type="submit">${button}</button></div></form><div id="result" role="status" aria-live="polite"></div></section>`;
const table=(headers,rows)=>`<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const rooms=[['101','2','Norte','Disponible'],['102','3','Sur','Ocupada'],['103','2','Norte','Reservada']];
const period=()=>input('Entrada','date','2026-10-01','name="entrada"')+input('Salida','date','2026-10-03','name="salida"');
let current='Acceso';
function show(name){current=name;nav.innerHTML=names.map(n=>`<button data-page="${n}" ${n===name?'aria-current="page"':''}>${n}</button>`).join('');let content='';
if(name==='Acceso')content='<p>Selección de perfil para recorrer la maqueta. No autentica usuarios reales.</p>'+form(input('Usuario de prueba','text','usuario_demo')+select('Perfil de prueba',['Encargado','Administrador']),'Entrar a la maqueta');
if(name==='Disponibilidad')content='<p>Consulta de habitaciones por fechas y capacidad.</p>'+form(period()+input('Cantidad de pasajeros','number','2','min="1" name="pasajeros"'),'Consultar')+`<section class="panel"><h3>Habitaciones de ejemplo</h3>${table(['Número','Capacidad','Orientación','Estado ilustrativo'],rooms)}</section>`;
if(name==='Habitaciones')content='<p>RF01 · Registro y edición de habitaciones.</p>'+form(input('Número de habitación','text','','name="numero"')+input('Capacidad','number','2','min="1"')+input('Orientación','text','Norte'),'Simular guardado')+`<section class="panel">${table(['Número','Capacidad','Orientación','Estado ilustrativo'],rooms)}</section>`;
if(name==='Huéspedes')content='<p>RF02 · Identificación del pasajero.</p>'+form(input('Identificación','text','','name="identificacion"')+input('Nombres')+input('Apellidos'),'Simular registro')+'<p class="muted">El tipo de documento y los datos obligatorios deben confirmarse con el hotel.</p>';
if(name==='Reservas')content='<p>RF08 · Reserva de una habitación para un intervalo.</p>'+form(input('Titular de ejemplo','text','Huésped de prueba')+select('Habitación de ejemplo',['101 · Capacidad 2','103 · Capacidad 2'])+period()+input('Pasajeros','number','2','min="1" max="2"'),'Simular reserva')+`<section class="panel">${table(['Reserva','Habitación','Entrada','Salida','Estado'],[['R-001 de prueba','103','01/10/2026','03/10/2026','Registrada']])}</section>`;
if(name==='Check-in')content='<p>RF04 · Inicio de estadía y asignación de habitación.</p>'+form(select('Reserva de origen',['Sin reserva','R-001 de prueba'])+select('Habitación de ejemplo',['101 · Capacidad 2'])+period()+input('Pasajeros','number','1','min="1" max="2"')+input('Identificación del huésped','text','DEMO-01'),'Simular check-in')+'<p class="muted">El sistema final debe comprobar la disponibilidad antes de confirmar.</p>';
if(name==='Check-out')content='<p>RF05 y RF06 · Cierre de estadía y cálculo de cuenta.</p>'+form(select('Estadía de ejemplo',['E-001 · Habitación 102'])+input('Pasajeros de prueba','number','2','min="1" name="cantidad"')+input('Tarifa de prueba por pasajero y noche (CLP)','number','','min="0" step="1" name="tarifa"')+input('Noches de prueba','number','2','min="1" step="1" name="noches"'),'Simular cálculo')+'<p class="muted">Fórmula de demostración: tarifa de prueba × noches por pasajero. La regla real de cobro no aparece en el caso.</p><button id="closeStay" disabled>Simular confirmación de salida</button>';
if(name==='Informes')content='<p>RF09 · Ocupación y reservas.</p>'+form(select('Tipo de informe',['Ocupación','Reservas'])+input('Fecha de referencia','date','2026-10-01'),'Consultar ejemplo')+`<section class="panel"><div class="stats"><div>Habitaciones de prueba<strong>3</strong></div><div>Ocupadas de prueba<strong>1</strong></div></div>${table(['Habitación','Estado ilustrativo','Pasajeros de prueba'],[['101','Disponible','0'],['102','Ocupada','2'],['103','Reservada','0']])}</section>`;
if(name==='Usuarios')content='<p>RF07 · Perfiles administrador y encargado.</p>'+form(input('Nombre de usuario','text','usuario_demo')+select('Perfil',['Encargado','Administrador']),'Simular asignación')+'<p class="muted">La matriz detallada de permisos es preliminar. Esta pantalla no modifica accesos reales.</p>';
view.innerHTML=`<h2>${name}</h2>${content}`;nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.page));
const f=view.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();const res=view.querySelector('#result');const dates=f.querySelectorAll('input[type=date]');if(dates.length===2 && dates[1].value<=dates[0].value){res.className='result error';res.textContent='La fecha de salida debe ser posterior a la entrada.';return}
if(current==='Acceso'){show('Disponibilidad');return}
res.className='result';
if(current==='Check-out'){const data=new FormData(f),q=Number(data.get('cantidad')),rate=Number(data.get('tarifa')),n=Number(data.get('noches'));if(!Number.isSafeInteger(q)||q<1||!Number.isSafeInteger(n)||n<1||!Number.isSafeInteger(rate)||rate<0){res.className='result error';res.textContent='Revisa los valores ingresados.';return}const format=x=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(x);res.textContent=`Simulación: ${format(rate*n)} por pasajero. Total para ${q} pasajeros: ${format(rate*n*q)}. Tarifa y fórmula de prueba.`;document.querySelector('#closeStay').disabled=false;document.querySelector('#closeStay').onclick=()=>{res.textContent+=' Salida simulada: estadía finalizada y habitación liberada.';document.querySelector('#closeStay').disabled=true}}
else if(current==='Disponibilidad')res.textContent='Resultado ilustrativo: habitación 101. El prototipo no consulta una base de datos ni valida reservas reales.';
else res.textContent='Acción simulada correctamente. No se han guardado datos reales.'};}
document.querySelector('#wire').onclick=e=>{const on=document.body.classList.toggle('wire');e.target.setAttribute('aria-pressed',on);e.target.textContent=on?'Ver mockup':'Ver wireframe'};
show('Acceso');
</script></body></html>
