ight="normal">validar disponibilidad</text><path d="M80,1590 L730,1590 L730,1690 L80,1690 Z" fill="#ffffff" stroke="#30363b" stroke-width="4"/><text x="405.0" y="1634.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Marcar CANCELADA y</text><text x="405.0" y="1659.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">liberar disponibilidad</text><ellipse cx="405.0" cy="1817.5" rx="325.0" ry="47.5" fill="#ffffff" stroke="#ff7474" stroke-width="4"/><text x="405.0" y="1824.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin · reserva actualizada</text><path d="M1850,1880 L2500,1880 L2500,1980 L1850,1980 Z" fill="#ffffff" stroke="#20aaa9" stroke-width="4"/><text x="2175.0" y="1924.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Mantener estadía ACTIVA</text><text x="2175.0" y="1949.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">y corregir la cuenta</text><ellipse cx="2175.0" cy="2107.5" rx="325.0" ry="47.5" fill="#ffffff" stroke="#ff7474" stroke-width="4"/><text x="2175.0" y="2114.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin sin check-out</text></g></svg>