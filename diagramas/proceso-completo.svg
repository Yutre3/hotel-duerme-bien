="2"/><path d="M1894.0,527.0 L1900.0,540 L1906.0,527.0" fill="none" stroke="#546778" stroke-width="2"/><path d="M1900.0,645 L1900.0,715" fill="none" stroke="#546778" stroke-width="2"/><path d="M1894.0,702.0 L1900.0,715 L1906.0,702.0" fill="none" stroke="#546778" stroke-width="2"/><text x="1930" y="684" font-size="16" text-anchor="middle" fill="#253747" font-weight="normal">Sí</text><path d="M1900.0,820 L1900.0,890" fill="none" stroke="#546778" stroke-width="2"/><path d="M1894.0,877.0 L1900.0,890 L1906.0,877.0" fill="none" stroke="#546778" stroke-width="2"/><path d="M1900.0,995 L1900.0,1065" fill="none" stroke="#546778" stroke-width="2"/><path d="M1894.0,1052.0 L1900.0,1065 L1906.0,1052.0" fill="none" stroke="#546778" stroke-width="2"/><text x="1930" y="1034" font-size="16" text-anchor="middle" fill="#253747" font-weight="normal">Sí</text><path d="M1900.0,1170 L1900.0,1240" fill="none" stroke="#546778" stroke-width="2"/><path d="M1894.0,1227.0 L1900.0,1240 L1906.0,1227.0" fill="none" stroke="#546778" stroke-width="2"/><path d="M2130,592.5 L2210,592.5 L2210,417.5 L2117.5,417.5" fill="none" stroke="#546778" stroke-width="2"/><path d="M2130.5,411.5 L2117.5,417.5 L2130.5,423.5" fill="none" stroke="#546778" stroke-width="2"/><text x="2206" y="572.5" font-size="16" text-anchor="middle" fill="#253747" font-weight="normal">No: corregir</text><path d="M2130,942.5 L2282,942.5 L2282,417.5 L2117.5,417.5" fill="none" stroke="#546778" stroke-width="2"/><path d="M2130.5,411.5 L2117.5,417.5 L2130.5,423.5" fill="none" stroke="#546778" stroke-width="2"/><text x="2278" y="922.5" font-size="16" text-anchor="middle" fill="#253747" font-weight="normal">No: corregir</text><text x="54" y="126.0" font-size="17" text-anchor="start" fill="#253747" font-weight="normal">1 Guardar una habitación</text><ellipse cx="300.0" cy="242.5" rx="230.0" ry="52.5" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="300.0" y="249.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Inicio</text><path d="M95,365 L530,365 L505,470 L70,470 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="300.0" y="412.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Anotar titular, habitación,</text><text x="300.0" y="437.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">fechas y cantidad de personas</text><path d="M300.0,540 L530,592.5 L300.0,645 L70,592.5 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="300.0" y="599.5" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Datos correctos?</text><path d="M300.0,715 L530,767.5 L300.0,820 L70,767.5 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="300.0" y="774.5" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Disponible y con espacio?</text><path d="M70,890 L530,890 L530,995 L70,995 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="300.0" y="949.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Guardar reserva</text><ellipse cx="300.0" cy="1117.5" rx="230.0" ry="52.5" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="300.0" y="1124.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Fin · habitación reservada</text><text x="854" y="126.0" font-size="17" text-anchor="start" fill="#253747" font-weight="normal">2 Registrar la llegada</text><ellipse cx="1100.0" cy="242.5" rx="230.0" ry="52.5" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1100.0" y="249.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Inicio</text><path d="M895,365 L1330,365 L1305,470 L870,470 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1100.0" y="412.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Elegir reserva o ingreso directo;</text><text x="1100.0" y="437.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">anotar a todos los huéspedes</text><path d="M1100.0,540 L1330,592.5 L1100.0,645 L870,592.5 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1100.0" y="599.5" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Fechas y huéspedes correctos?</text><path d="M1100.0,715 L1330,767.5 L1100.0,820 L870,767.5 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1100.0" y="774.5" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Disponible y con espacio?</text><path d="M870,890 L1330,890 L1330,995 L870,995 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1100.0" y="937.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Guardar estadía y pasajeros;</text><text x="1100.0" y="962.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">marcar reserva CHECK_IN si existe</text><ellipse cx="1100.0" cy="1117.5" rx="230.0" ry="52.5" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1100.0" y="1124.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Fin · habitación ocupada</text><text x="1654" y="126.0" font-size="17" text-anchor="start" fill="#253747" font-weight="normal">3 Registrar la salida</text><ellipse cx="1900.0" cy="242.5" rx="230.0" ry="52.5" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1900.0" y="249.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Inicio</text><path d="M1695,365 L2130,365 L2105,470 L1670,470 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1900.0" y="412.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Elegir estadía activa</text><text x="1900.0" y="437.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">y fecha de salida</text><path d="M1900.0,540 L2130,592.5 L1900.0,645 L1670,592.5 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1900.0" y="599.5" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Fecha y tarifa correctas?</text><path d="M1670,715 L2130,715 L2130,820 L1670,820 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1900.0" y="774.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Calcular cuenta por persona</text><path d="M1900.0,890 L2130,942.5 L1900.0,995 L1670,942.5 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1900.0" y="937.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Cuenta confirmada y</text><text x="1900.0" y="962.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">salida sin conflicto?</text><path d="M1670,1065 L2130,1065 L2130,1170 L1670,1170 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1900.0" y="1112.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Guardar costos, cerrar estadía</text><text x="1900.0" y="1137.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">y liberar habitación</text><ellipse cx="1900.0" cy="1292.5" rx="230.0" ry="52.5" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1900.0" y="1299.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Fin · salida registrada</text><text x="1200" y="1530" font-size="24" text-anchor="middle" fill="#253747" font-weight="normal">Una reserva puede modificarse o cancelarse antes de la llegada.</text><text x="1200" y="1570" font-size="24" text-anchor="middle" fill="#253747" font-weight="normal">La entrada también puede registrarse sin reserva.</text></g></svg>