e="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Regla de cobro y</text><text x="690.0" y="822.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">tarifa válidas y definidas?</text><path d="M450,920 L930,920 L930,1015 L450,1015 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="962.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Calcular costo por pasajero</text><text x="690.0" y="987.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">y total de cuenta · CU07</text><path d="M475,1085 L930,1085 L905,1180 L450,1180 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="1127.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Mostrar detalle por huésped,</text><text x="690.0" y="1152.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">período, costos y total</text><path d="M690.0,1250 L930,1297.5 L690.0,1345 L450,1297.5 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="1292.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Confirma la cuenta</text><text x="690.0" y="1317.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">y la salida?</text><path d="M690.0,1415 L930,1462.5 L690.0,1510 L450,1462.5 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="1457.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Salida sin conflicto con</text><text x="690.0" y="1482.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">reservas posteriores?</text><path d="M450,1580 L930,1580 L930,1675 L450,1675 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="1622.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Guardar costo de cada pasajero</text><text x="690.0" y="1647.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">y estadía FINALIZADA</text><path d="M450,1745 L930,1745 L930,1840 L450,1840 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="1787.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Cerrar reserva asociada, si existe;</text><text x="690.0" y="1812.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">liberar ocupación de habitación</text><ellipse cx="690.0" cy="1957.5" rx="240.0" ry="47.5" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="1964.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Fin</text><path d="M1090,425 L1420,425 L1420,520 L1090,520 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1255.0" y="467.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Informar estadía</text><text x="1255.0" y="492.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">o fecha inválidas</text><path d="M1090,755 L1420,755 L1420,850 L1090,850 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1255.0" y="797.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Solicitar definición o</text><text x="1255.0" y="822.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">corrección del cobro</text><path d="M1090,1250 L1420,1250 L1420,1345 L1090,1345 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1255.0" y="1304.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Mantener estadía ACTIVA</text><ellipse cx="1255.0" cy="1410.0" rx="165.0" ry="35.0" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1255.0" y="1417.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Fin sin cambios</text><path d="M1090,1415 L1420,1415 L1420,1510 L1090,1510 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1255.0" y="1457.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Resolv