="middle" fill="#253747" font-weight="normal">tarifa válidas y definidas?</text><path d="M450,920 L930,920 L930,1015 L450,1015 Z" fill="#ffffff" stroke="#30363b" stroke-width="4"/><text x="690.0" y="962.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Calcular costo por pasajero</text><text x="690.0" y="987.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">y total de cuenta · CU07</text><path d="M475,1085 L930,1085 L905,1180 L450,1180 Z" fill="#ffffff" stroke="#20aaa9" stroke-width="4"/><text x="690.0" y="1127.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Mostrar detalle por huésped,</text><text x="690.0" y="1152.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">período, costos y total</text><path d="M690.0,1250 L930,1297.5 L690.0,1345 L450,1297.5 Z" fill="#ffffff" stroke="#30363b" stroke-width="4"/><text x="690.0" y="1292.0" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">¿Confirma la cuenta</text><text x="690.0" y="1317.0" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">y la salida?</text><path d="M690.0,1415 L930,1462.5 L690.0,1510 L450,1462.5 Z" fill="#ffffff" stroke="#30363b" stroke-width="4"/><text x="690.0" y="1457.0" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">¿Salida sin conflicto con</text><text x="690.0" y="1482.0" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">reservas posteriores?</text><path d="M450,1580 L930,1580 L930,1675 L450,1675 Z" fill="#ffffff" stroke="#30363b" stroke-width="4"/><text x="690.0" y="1622.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Guardar costo de cada pasajero</text><text x="690.0" y="1647.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">y estadía FINALIZADA</text><path d="M450,1745 L930,1745 L930,1840 L450,1840 Z" fill="#ffffff" stroke="#30363b" stroke-width="4"/><text x="690.0" y="1787.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Cerrar reserva asociada, si existe;</text><text x="690.0" y="1812.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">liberar ocupación de habitación</text><ellipse cx="690.0" cy="1957.5" rx="240.0" ry="47.5" fill="#ffffff" stroke="#ff7474" stroke-width="4"/><text x="690.0" y="1964.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin</text><ellipse cx="1285.0" cy="472.5" rx="195.0" ry="47.5" fill="#ffffff" stroke="#ff7474" stroke-width="4"/><text x="1285.0" y="454.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin ·</text><text x="1285.0" y="479.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">informar estadía o fecha</text><text x="1285.0" y="504.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">inválidas</text><ellipse cx="1285.0" cy="802.5" rx="195.0" ry="47.5" fill="#ffffff" stroke="#ff7474" stroke-width="4"/><text x="1285.0" y="784.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin ·</text><text x="1285.0" y="809.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">solicitar definición o</text><text x="1285.0" y="834.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">corrección del cobro</text><ellipse cx="1285.0" cy="1297.5" rx="195.0" ry="47.5" fill="#ffffff" stroke="#ff7474" stroke-width="4"/><text x="1285.0" y="1292.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin ·</text><text x="1285.0" y="1317.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">mantener estadía activa</text><ellipse cx="1285.0" cy="1462.5" rx="195.0" ry="47.5" fill="#ffffff" stroke="#ff7474" stroke-width="4"/><text x="1285.0" y="1444.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin ·</text><text x="1285.0" y="1469.5" 