<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif"><text x="800.0" y="44" font-size="27" text-anchor="middle" fill="#163b50" font-weight="bold">Kanban · Duerme Bien</text><path d="M40,100 L400,100 L400,950 L40,950 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="60" y="130" font-size="20" text-anchor="start" fill="#253747" font-weight="bold">Por hacer</text><path d="M430,100 L790,100 L790,950 L430,950 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="450" y="130" font-size="20" text-anchor="start" fill="#253747" font-weight="bold">En curso</text><path d="M820,100 L1180,100 L1180,950 L820,950 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="840" y="130" font-size="20" text-anchor="start" fill="#253747" font-weight="bold">En revisión</text><path d="M1210,100 L1570,100 L1570,950 L1210,950 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1230" y="130" font-size="20" text-anchor="start" fill="#253747" font-weight="bold">Terminado</text><path d="M55,175 L385,175 L385,325 L55,325 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="220.0" y="232.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Validar identificación y</text><text x="220.0" y="257.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">reglas de habitación</text><text x="220.0" y="282.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">compartida</text><path d="M55,360 L385,360 L385,510 L55,510 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="220.0" y="429.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Validar tarifa y fórmula</text><text x="220.0" y="454.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">definitiva de cobro</text><path d="M55,545 L385,545 L385,695 L55,695 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="220.0" y="602.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Validar permisos y</text><text x="220.0" y="627.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">condiciones de gestión de</text><text x="220.0" y="652.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">reservas</text><path d="M55,730 L385,730 L385,880 L55,880 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="220.0" y="787.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Recibir rúbrica y</text><text x="220.0" y="812.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">retroalimentación de</text><text x="220.0" y="837.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Evaluación 1</text><path d="M445,175 L775,175 L775,275 L445,275 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="610.0" y="232.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Sin tareas en curso</text><path d="M835,175 L1165,175 L1165,325 L835,325 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1000.0" y="244.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Informe de requerimientos y</text><text x="1000.0" y="269.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">entrevista simulada</text><path d="M835,360 L1165,360 L1165,510 L835,510 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1000.0" y="429.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Casos de uso, procesos y</text><text x="1000.0" y="454.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">modelo de datos</text><path d="M835,545 L1165,545 L1165,695 L835,695 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1000.0" y="627.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Sketch, wireframes y mockups</text><path d="M835,730 L1165,730 L1165,880 L835,880 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1000.0" y="799.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Prueba académica del</text><text x="1000.0" y="824.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">prototipo</text><path d="M1225,175 L1555,175 L1555,325 L1225,325 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1390.0" y="244.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Conservar los 11 materiales</text><text x="1390.0" y="269.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">originales</text><path d="M1225,360 L1555,360 L1555,510 L1225,510 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1390.0" y="429.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Reconstruir diagramas nativos</text><text x="1390.0" y="454.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">y enlazar el editor</text><path d="M1225,545 L1555,545 L1555,695 L1225,695 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1390.0" y="614.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Implementar pasajeros</text><text x="1390.0" y="639.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">individuales y costos</text><path d="M1225,730 L1555,730 L1555,880 L1225,880 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="1390.0" y="799.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Verificar procesos y publicar</text><text x="1390.0" y="824.5" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">la entrega</text></g></svg>