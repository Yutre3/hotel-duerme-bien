ize="20" text-anchor="middle" fill="#163b50" font-weight="bold">No</text><path d="M930,1297.5 L1090,1297.5" fill="none" stroke="#546778" stroke-width="4"/><path d="M1077.0,1303.5 L1090,1297.5 L1077.0,1291.5" fill="none" stroke="#546778" stroke-width="4"/><rect x="986.0" y="1259" width="48" height="34" rx="5" fill="#ffffff" stroke="none"/><text x="1010" y="1282" font-size="20" text-anchor="middle" fill="#163b50" font-weight="bold">No</text><ellipse cx="690.0" cy="142.5" rx="240.0" ry="47.5" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="149.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Inicio</text><path d="M475,260 L930,260 L905,355 L450,355 Z" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="302.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Seleccionar reserva o ingreso directo;</text><text x="690.0" y="327.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">habitación, fechas y todos los huéspedes</text><path d="M690.0,425 L930,472.5 L690.0,520 L450,472.5 Z" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="467.0" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">¿Sin reserva o reserva</text><text x="690.0" y="492.0" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">REGISTRADA?</text><path d="M450,590 L930,590 L930,685 L450,685 Z" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="632.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Validar huéspedes registrados</text><text x="690.0" y="657.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">y cantidad de pasajeros</text><path d="M690.0,755 L930,802.5 L690.0,850 L450,802.5 Z" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="797.0" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">¿Fechas y pasajeros válidos,</text><text x="690.0" y="822.0" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">sin estadía activa previa?</text><path d="M450,920 L930,920 L930,1015 L450,1015 Z" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="962.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Revisar capacidad, reservas</text><text x="690.0" y="987.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">y ocupación actual · CU05</text><path d="M690.0,1085 L930,1132.5 L690.0,1180 L450,1132.5 Z" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="1127.0" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">¿Habitación disponible y</text><text x="690.0" y="1152.0" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">capacidad suficiente?</text><path d="M690.0,1250 L930,1297.5 L690.0,1345 L450,1297.5 Z" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="1304.5" font-size="20" text-anchor="middle" fill="#253747" font-weight="normal">¿Confirma el ingreso?</text><path d="M450,1415 L930,1415 L930,1510 L450,1510 Z" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="1457.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Crear estadía ACTIVA</text><text x="690.0" y="1482.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">y registrar ESTADIA_HUESPED</text><path d="M450,1580 L930,1580 L930,1675 L450,1675 Z" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="1622.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Si hay reserva: pasar a CHECK_IN;</text><text x="690.0" y="1647.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">mostrar habitación OCUPADA</text><path d="M475,1745 L930,1745 L905,1840 L450,1840 Z" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="1787.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Mostrar estadía y</text><text x="690.0" y="1812.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">lista de pasajeros asignados</text><ellipse cx="690.0" cy="1957.5" rx="240.0" ry="47.5" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="690.0" y="1964.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin</text><ellipse cx="1285.0" cy="472.5" rx="195.0" ry="47.5" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="1285.0" y="454.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin ·</text><text x="1285.0" y="479.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">informar reserva inválida o</text><text x="1285.0" y="504.5" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">ya utilizada</text><ellipse cx="1285.0" cy="802.5" rx="195.0" ry="47.5" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="1285.0" y="772.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin ·</text><text x="1285.0" y="797.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">identificar pasajeros</text><text x="1285.0" y="822.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">faltantes o corregir sus</text><text x="1285.0" y="847.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">datos</text><ellipse cx="1285.0" cy="1132.5" rx="195.0" ry="47.5" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="1285.0" y="1102.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin ·</text><text x="1285.0" y="1127.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">mostrar conflicto; elegir</text><text x="1285.0" y="1152.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">fechas o habitación</text><text x="1285.0" y="1177.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">distintas</text><ellipse cx="1285.0" cy="1297.5" rx="195.0" ry="47.5" fill="#ffffff" stroke="#546778" stroke-width="4"/><text x="1285.0" y="1292.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">Fin ·</text><text x="1285.0" y="1317.0" font-size="22" text-anchor="middle" fill="#253747" font-weight="normal">cancelar la operación</text></g></svg>