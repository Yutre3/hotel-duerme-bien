xt x="690.0" y="797.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Fechas y pasajeros válidos,</text><text x="690.0" y="822.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">sin estadía activa previa?</text><path d="M450,920 L930,920 L930,1015 L450,1015 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="962.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Revisar capacidad, reservas</text><text x="690.0" y="987.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">y ocupación actual · CU05</text><path d="M690.0,1085 L930,1132.5 L690.0,1180 L450,1132.5 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="1127.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Habitación disponible y</text><text x="690.0" y="1152.0" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">capacidad suficiente?</text><path d="M690.0,1250 L930,1297.5 L690.0,1345 L450,1297.5 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="1304.5" font-size="18" text-anchor="middle" fill="#253747" font-weight="normal">¿Confirma el ingreso?</text><path d="M450,1415 L930,1415 L930,1510 L450,1510 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="1457.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Crear estadía ACTIVA</text><text x="690.0" y="1482.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">y registrar ESTADIA_HUESPED</text><path d="M450,1580 L930,1580 L930,1675 L450,1675 Z" fill="#ffffff" stroke="#546778" stroke-width="2"/><text x="690.0" y="1622.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">Si hay reserva: pasar a CHECK_IN;</text><text x="690.0" y="1647.0" font-size="19" text-anchor="middle" fill="#253747" font-weight="normal">mostrar habitación OCUPADA</text><path d="M475,1745 L930,1745 L905,1840 