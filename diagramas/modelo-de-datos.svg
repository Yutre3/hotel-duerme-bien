">costo_clp: INTEGER NULL, mayor o igual a 0</text><text x="790" y="2050" font-size="23" text-anchor="middle" fill="#253747" font-weight="normal">PK: clave primaria   ·   FK: clave foránea   ·   UNIQUE: valor único</text><text x="790" y="2090" font-size="23" text-anchor="middle" fill="#253747" font-weight="normal">NULL: dato opcional o pendiente   ·   NOT NULL: dato obligatorio</text><text x="790" y="2130" font-size="21" text-anchor="middle" fill="#253747" font-weight="normal">Una estadía puede iniciar sin reserva; cada pasajero tiene su costo individual.</text></g></svg>